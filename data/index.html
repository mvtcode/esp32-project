<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Clock Config</title>
    <style>
        :root {
            --p: #007bff;
            --bg: #f4f4f9;
            --txt: #333;
        }

        body {
            font-family: sans-serif;
            background: var(--bg);
            color: var(--txt);
            display: flex;
            justify-content: center;
            padding: 20px;
            padding-bottom: 60px;
            margin: 0;
        }

        .card {
            background: #fff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            margin-top: 0;
            color: var(--p);
            text-align: center;
            font-size: 1.5rem;
        }

        .item {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        input:disabled {
            background: #f0f0f0;
            cursor: not-allowed;
        }

        button {
            width: 100%;
            padding: 14px;
            background: var(--p);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        button:hover:not(:disabled) {
            background: #0056b3;
        }

        button.secondary {
            background: #6c757d;
        }

        button.secondary:hover:not(:disabled) {
            background: #545b62;
        }

        #msg {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            display: none;
            font-size: 0.9rem;
        }

        .success {
            background: #d4edda;
            color: #155724;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
        }

        .info {
            background: #d1ecf1;
            color: #0c5460;
        }

        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #fff;
            text-align: center;
            padding: 12px 0;
            box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.1);
            font-size: 0.9rem;
            color: var(--txt);
        }

        footer a {
            color: var(--p);
            text-decoration: none;
            font-weight: bold;
        }

        footer a:hover {
            text-decoration: underline;
        }

        .wifi-list {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .wifi-item {
            padding: 12px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .wifi-item:last-child {
            border-bottom: none;
        }

        .wifi-item:hover {
            background: #f8f9fa;
        }

        .wifi-item.selected {
            background: #e7f3ff;
            border-left: 4px solid var(--p);
        }

        .wifi-info {
            flex: 1;
        }

        .wifi-ssid {
            font-weight: bold;
            margin-bottom: 2px;
        }

        .wifi-signal {
            font-size: 0.85rem;
            color: #666;
        }

        .wifi-lock {
            color: #666;
            font-size: 1.2rem;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--p);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 8px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>Cấu Hình Hệ Thống</h2>

        <div class="item">
            <button id="scanBtn" class="secondary" onclick="scanWiFi()">
                <span id="scanText">Quét WiFi</span>
            </button>
        </div>

        <div id="wifiListContainer" class="hidden">
            <div class="item">
                <label>Chọn WiFi</label>
                <div class="wifi-list" id="wifiList"></div>
            </div>
        </div>

        <div class="item">
            <label>Mật khẩu</label>
            <input type="password" id="pw" placeholder="Mật khẩu WiFi" disabled>
        </div>

        <div class="item">
            <label>Thành phố để lấy thời tiết</label>
            <select id="city" onchange="updateCoords()">
            </select>
        </div>

        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
            <div style="flex:1">
                <label>Vĩ độ (Lat)</label>
                <input type="text" id="lat" readonly style="background:#eee">
            </div>
            <div style="flex:1">
                <label>Kinh độ (Long)</label>
                <input type="text" id="lon" readonly style="background:#eee">
            </div>
        </div>

        <button id="btn" onclick="sendData()">Lưu cấu hình</button>
        <div id="msg"></div>
    </div>

    <script>
        // Danh sách thành phố
        const cities = [
            { name: "Hà Nội", lat: 21.0285, lon: 105.8542 },
            { name: "Hải Phòng", lat: 20.8449, lon: 106.6881 },
            { name: "Đà Nẵng", lat: 16.0544, lon: 108.2022 },
            { name: "TP. Hồ Chí Minh", lat: 10.7626, lon: 106.6601 },
            { name: "Cần Thơ", lat: 10.0333, lon: 105.7833 },
            { name: "Điện Biên", lat: 21.3833, lon: 103.0167 }
        ];

        const citySelect = document.getElementById('city');
        const latInp = document.getElementById('lat');
        const lonInp = document.getElementById('lon');
        const pwInp = document.getElementById('pw');

        let selectedWiFi = null;
        let wifiNetworks = [];

        // Khởi tạo dropdown thành phố
        cities.forEach((c, index) => {
            let opt = document.createElement('option');
            opt.value = index;
            opt.innerHTML = c.name;
            citySelect.appendChild(opt);
        });

        function updateCoords() {
            const c = cities[citySelect.value];
            latInp.value = c.lat;
            lonInp.value = c.lon;
        }

        // Chạy lần đầu để set giá trị mặc định
        updateCoords();

        function getSignalStrength(rssi) {
            if (rssi >= -50) return "Tuyệt vời";
            if (rssi >= -60) return "Tốt";
            if (rssi >= -70) return "Khá";
            return "Yếu";
        }

        function scanWiFi() {
            const scanBtn = document.getElementById('scanBtn');
            const scanText = document.getElementById('scanText');
            const msg = document.getElementById('msg');

            scanBtn.disabled = true;
            scanText.innerHTML = '<span class="spinner"></span>Đang quét...';
            msg.style.display = 'none';

            // Step 1: Start the scan
            const xhr = new XMLHttpRequest();
            xhr.open("GET", "/api/wifi/start", true);

            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        const data = JSON.parse(xhr.responseText);
                        if (data.status === "started" || data.status === "already_scanning") {
                            // Step 2: Poll for results
                            pollScanResults();
                        } else {
                            scanBtn.disabled = false;
                            scanText.innerHTML = 'Quét WiFi';
                            msg.innerHTML = "Lỗi: " + (data.message || "Unknown error");
                            msg.className = 'error';
                            msg.style.display = 'block';
                        }
                    } else {
                        scanBtn.disabled = false;
                        scanText.innerHTML = 'Quét WiFi';
                        msg.innerHTML = "Lỗi khi bắt đầu quét: " + xhr.status;
                        msg.className = 'error';
                        msg.style.display = 'block';
                    }
                }
            };

            xhr.send();
        }

        function pollScanResults() {
            const scanBtn = document.getElementById('scanBtn');
            const scanText = document.getElementById('scanText');
            const msg = document.getElementById('msg');

            const xhr = new XMLHttpRequest();
            xhr.open("GET", "/api/wifi/results", true);

            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        const data = JSON.parse(xhr.responseText);

                        if (data.status === "scanning") {
                            // Still scanning, poll again in 1 second
                            setTimeout(pollScanResults, 1000);
                        } else if (data.status === "complete") {
                            // Scan complete!
                            scanBtn.disabled = false;
                            scanText.innerHTML = 'Quét WiFi';
                            wifiNetworks = data.networks || [];
                            displayWiFiList(wifiNetworks);
                        } else if (data.status === "not_started") {
                            // Shouldn't happen, but handle it
                            scanBtn.disabled = false;
                            scanText.innerHTML = 'Quét WiFi';
                            msg.innerHTML = "Chưa bắt đầu quét";
                            msg.className = 'error';
                            msg.style.display = 'block';
                        } else {
                            // Unknown status
                            scanBtn.disabled = false;
                            scanText.innerHTML = 'Quét WiFi';
                            msg.innerHTML = "Lỗi: " + (data.message || "Unknown status");
                            msg.className = 'error';
                            msg.style.display = 'block';
                        }
                    } else {
                        scanBtn.disabled = false;
                        scanText.innerHTML = 'Quét WiFi';
                        msg.innerHTML = "Lỗi khi lấy kết quả: " + xhr.status;
                        msg.className = 'error';
                        msg.style.display = 'block';
                    }
                }
            };

            xhr.send();
        }

        function displayWiFiList(networks) {
            const wifiList = document.getElementById('wifiList');
            const wifiListContainer = document.getElementById('wifiListContainer');

            wifiList.innerHTML = '';

            if (networks.length === 0) {
                wifiList.innerHTML = '<div style="padding:12px; text-align:center; color:#999;">Không tìm thấy WiFi nào</div>';
                wifiListContainer.classList.remove('hidden');
                return;
            }

            networks.forEach((network, index) => {
                const item = document.createElement('div');
                item.className = 'wifi-item';
                item.onclick = () => selectWiFi(index);

                const info = document.createElement('div');
                info.className = 'wifi-info';

                const ssid = document.createElement('div');
                ssid.className = 'wifi-ssid';
                ssid.textContent = network.ssid;

                const signal = document.createElement('div');
                signal.className = 'wifi-signal';
                signal.textContent = `${getSignalStrength(network.rssi)} (${network.rssi} dBm)`;

                info.appendChild(ssid);
                info.appendChild(signal);
                item.appendChild(info);

                if (network.encryption !== 'OPEN') {
                    const lock = document.createElement('div');
                    lock.className = 'wifi-lock';
                    lock.innerHTML = '🔒';
                    item.appendChild(lock);
                }

                wifiList.appendChild(item);
            });

            wifiListContainer.classList.remove('hidden');
        }

        function selectWiFi(index) {
            selectedWiFi = wifiNetworks[index];

            // Update UI
            const items = document.querySelectorAll('.wifi-item');
            items.forEach((item, i) => {
                if (i === index) {
                    item.classList.add('selected');
                } else {
                    item.classList.remove('selected');
                }
            });

            // Enable/disable password field based on encryption
            if (selectedWiFi.encryption === 'OPEN') {
                pwInp.disabled = true;
                pwInp.value = '';
                pwInp.placeholder = 'WiFi không yêu cầu mật khẩu';
            } else {
                pwInp.disabled = false;
                pwInp.placeholder = 'Nhập mật khẩu WiFi';
                pwInp.focus();
            }
        }

        function sendData() {
            const btn = document.getElementById('btn');
            const msg = document.getElementById('msg');

            // Validation
            if (!selectedWiFi) {
                msg.innerHTML = "Vui lòng chọn WiFi từ danh sách";
                msg.className = 'error';
                msg.style.display = 'block';
                return;
            }

            const password = pwInp.value;

            // Validate password for encrypted networks
            if (selectedWiFi.encryption !== 'OPEN') {
                if (!password) {
                    msg.innerHTML = "Vui lòng nhập mật khẩu WiFi";
                    msg.className = 'error';
                    msg.style.display = 'block';
                    pwInp.focus();
                    return;
                }

                if (password.length < 8) {
                    msg.innerHTML = "Mật khẩu phải có ít nhất 8 ký tự";
                    msg.className = 'error';
                    msg.style.display = 'block';
                    pwInp.focus();
                    return;
                }
            }

            // Validate coordinates
            const latitude = parseFloat(latInp.value);
            const longitude = parseFloat(lonInp.value);

            if (isNaN(latitude) || isNaN(longitude)) {
                msg.innerHTML = "Tọa độ không hợp lệ";
                msg.className = 'error';
                msg.style.display = 'block';
                return;
            }

            const payload = {
                ssid: selectedWiFi.ssid,
                password: password,
                latitude: latitude,
                longitude: longitude
            };

            btn.disabled = true;
            msg.style.display = 'block';
            msg.innerHTML = '<span class="spinner"></span>Đang gửi dữ liệu...';
            msg.className = 'info';

            const xhr = new XMLHttpRequest();
            xhr.open("POST", "/api/save", true);
            xhr.setRequestHeader("Content-Type", "application/json");

            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        msg.innerHTML = "Lưu thành công! Thiết bị đang khởi động lại...";
                        msg.className = 'success';
                    } else {
                        msg.innerHTML = "Lỗi: " + xhr.status;
                        msg.className = 'error';
                        btn.disabled = false;
                    }
                }
            };

            xhr.send(JSON.stringify(payload));
        }
    </script>

    <footer>
        Power by <a href="https://www.facebook.com/mvt.hp.star/" target="_blank">Mạc Tân</a> | Mobile: <a
            href="tel:0964335688">0964 335 688</a>
    </footer>

</body>

</html>
