[env:esp32-s3-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; Flash 16MB — quan trọng: dùng DIO mode cho ổn định trên nhiều board clone
board_upload.flash_size = 16MB
board_build.flash_mode = dio

; Enable PSRAM 8MB OPI
board_build.psram = enabled
board_build.arduino.memory_type = qio_opi

; Dùng partitions.csv gốc của project (có model partition cho ESP-SR)
board_build.partitions = partitions.csv

; CPU 240MHz
board_build.f_cpu = 240000000L

; Filesystem config
board_build.filesystem = spiffs

build_flags =
    ; Tắt USB CDC on boot để Serial dùng Hardware UART0 (kết nối qua chip CH340/CP2102)
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    
    ; Bật PSRAM cho ESP-SR / UI
    -DBOARD_HAS_PSRAM
    
    ; Debug level
    -DCORE_DEBUG_LEVEL=3
    
    ; Optimization cho AI
    -O2
    -DI2S_SAMPLE_RATE=16000
    -DI2S_CHANNEL_NUM=1
    
    ; Demo mode để test không cần model
    -DVOICE_DEMO_MODE

lib_deps =
    olikraus/U8g2 @ ^2.35.19
    bblanchon/ArduinoJson @ ^7.0.4
