; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = 
	default
	time
upload_speed = 921600
board_build.partitions = partitions_custom.csv
board_build.filesystem = spiffs
board_build.data_dir = src/data
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
build_flags = 
	-Os
	-DNDEBUG
	-fno-exceptions
	-fno-rtti
	-DCORE_DEBUG_LEVEL=0
	-DARDUINO_RUNNING_CORE=1
	-DARDUINO_EVENT_RUNNING_CORE=1
	-Wl,--gc-sections
	; --- Logging control ---
	; Uncomment the line below to enable Serial debug logs (development mode)
	; Remove/comment out for release build — saves ~4ms per log line on 115200 baud
	; -DENABLE_SERIAL_LOG

lib_deps =
	olikraus/U8g2@^2.35.19
	kosme/arduinoFFT@^2.0.1
	tzapu/WiFiManager@^2.0.17
	https://github.com/ayushsharma82/ElegantOTA.git
	bblanchon/ArduinoJson@^7.0.4
	arduino-libraries/NTPClient@^3.2.1

