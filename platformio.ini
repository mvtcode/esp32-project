[env:esp32dev]
platform = espressif32@~6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Build options
build_flags = 
    -DCORE_DEBUG_LEVEL=0
    -DUSER_SETUP_LOADED=1
    -DST7796_DRIVER=1
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=27
    -DTOUCH_CS=33
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSPI_FREQUENCY=40000000
    -DSPI_TOUCH_FREQUENCY=2500000

; Thư viện phụ thuộc
lib_deps = 
    bodmer/TFT_eSPI@^2.5.43
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    earlephilhower/ESP8266Audio@^1.9.9
