; PlatformIO Project Configuration File
; IoT Voice Command System — ESP32-S3-N16R8
; Hardware: INMP441 mic (I2S), SH1106 OLED 1.3" 128x64 (I2C), 4 buttons, 6 relays
; AI Stack: ESP-SR (WakeNet + MultiNet) via 74th wrapper
; Display: U8g2 direct (SH1106 I2C), dual-core FreeRTOS
;
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32 @ ^6.11.0
board     = esp32-s3-devkitc-1
framework = arduino

; ─── Memory: N16R8 (16MB Flash, 8MB OPI PSRAM) ───────────────────────────────
board_build.arduino.memory_type = opi_opi
board_build.flash_size           = 16MB
board_build.flash_mode           = opi
board_build.partitions           = partitions.csv

; ─── Serial Monitor ───────────────────────────────────────────────────────────
monitor_speed   = 115200
monitor_filters =
    default
    time
    esp32_exception_decoder

; ─── Upload ───────────────────────────────────────────────────────────────────
upload_speed = 921600

; ─── Build Flags ──────────────────────────────────────────────────────────────
build_flags =
    ; --- Debug level (3 = INFO, set to 0 for production) ---
    -DCORE_DEBUG_LEVEL=3

    ; --- ESP32-S3 OPI PSRAM ---
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

    ; --- Compiler: speed optimization for AI inference ---
    -O2

    ; --- I2S audio config: mono, 16kHz (required by ESP-SR) ---
    -DI2S_SAMPLE_RATE=16000
    -DI2S_CHANNEL_NUM=1

    ; --- Include paths ---
    -I src

; ─── Libraries ────────────────────────────────────────────────────────────────
lib_deps =
    ; U8g2 — display driver for SH1106 OLED 1.3" 128x64 (I2C)
    olikraus/U8g2 @ ^2.35.19

    ; LovyanGFX — retained for future TFT expansion (not used for OLED)
    lovyan03/LovyanGFX @ ^1.1.12

    ; M5Unified — required by ESP-SR wrapper below
    m5stack/M5Unified @ ^0.2.10

    ; ESP-SR wrapper for Arduino (WakeNet + MultiNet)
    ; feedAudio() receives raw I2S int16 samples from INMP441
    https://github.com/74th/ESP-SR-For-M5Unified.git

; ─── Extra Scripts ────────────────────────────────────────────────────────────
; Flash srmodels.bin to the 'model' partition automatically after upload.
; Place srmodels.bin in models/ folder first, then uncomment:
; extra_scripts = post:scripts/flash_srmodels.py
